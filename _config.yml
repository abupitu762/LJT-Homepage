# Academic Pages project site
locale: en-US
site_theme: default
title: Junteng Liu
title_separator: "–"
name: Junteng Liu
description: Junteng Liu's research in natural language processing and machine learning at the HKUST NLP Group.
url: https://abupitu762.github.io
baseurl: /LJT-Homepage
repository: abupitu762/LJT-Homepage

author:
  name: Junteng Liu
  avatar: junteng-liu.svg
  bio: Ph.D. candidate in Computer Science
  employer: HKUST NLP Group
  email: jliugi@connect.ust.hk
  github: Vicent0205
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: junteng88716710

og_image: junteng-liu.svg
atom_feed:
  hide: true

# Keep upstream examples available in the fork but out of the built site.
include:
  - _pages
exclude:
  - _pages/404.md
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - _posts
  - _drafts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - .github
  - AGENTS.md
  - README.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - files
  - markdown_generator
  - talkmap
  - scripts
  - package.json
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
sass:
  sass_dir: _sass
  style: compressed
timezone: Etc/UTC
plugins:
  - jekyll-feed
  - jekyll-sitemap
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
